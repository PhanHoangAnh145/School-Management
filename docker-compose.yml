services:
  db:
    image: mysql:8.0
    container_name: student_db
    restart: always
    environment:
      MYSQL_DATABASE: student_management_db
      MYSQL_ROOT_PASSWORD: spring
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: student_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/student_management_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=spring
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: student_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data: